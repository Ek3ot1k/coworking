version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: coworking_db
    restart: always
    environment:
      POSTGRES_DB: coworking_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: coworking_app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      # Подключаемся к контейнеру базы данных по имени сервиса (db)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/coworking_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  postgres_data: